name: GitHub Action Slack Notify CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js v24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Notify slack
        # Don't attempt to send Slack notifications on fork PRs which don't have access to secrets
        if: env.SLACK_BOT_TOKEN
        id: slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: ./
        with:
          channel_id: CB9QT2NNR
          status: STARTED
          color: warning
      - name: Get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: yarn install and test
        run: |
          yarn install --frozen-lockfile
          yarn test
        env:
          CI: true
      - name: yarn build
        run: yarn build
      - name: Verify bundled action is up to date
        run: |
          git diff --exit-code -- dist/index.js
          test -z "$(git status --porcelain --untracked-files=all -- dist)"

      # Legacy automatic release steps are intentionally disabled.
      # Releases have been created manually since v1.6.0. The release command
      # used an unpinned semantic-release version with plugins from 2020, while
      # the "update v1 tag" command force-pushed refs/heads/v1 (a branch, not a
      # tag). Do not re-enable these steps without a separately reviewed update
      # of the release process.
      #
      # - name: release
      #   if: ${{ endsWith(github.ref, '/main') }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: npx semantic-release
      # - name: update v1 tag
      #   if: ${{ endsWith(github.ref, '/main') }}
      #   run: 'git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:refs/heads/v1'
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify slack success
        if: env.SLACK_BOT_TOKEN
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: ./
        with:
          message_id: ${{ steps.slack.outputs.message_id }}
          channel_id: CB9QT2NNR
          status: SUCCESS
          color: good
